<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <style>
    body { width: 320px; margin: 0; padding: 14px; font: 13px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; color: #111; }
    h1 { font-size: 15px; margin: 0 0 6px; }
    .tag { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; margin-left: 6px; vertical-align: middle; }
    .pro { background: #e8f7f1; color: #0b7a5c; border: 1px solid #10a37f; }
    .free { background: #f3f3f3; color: #666; border: 1px solid #ddd; }
    p { margin: 0 0 10px; color: #555; font-size: 12px; }
    button { width: 100%; padding: 8px 10px; margin-bottom: 8px; border-radius: 8px; border: 1px solid #10a37f;
             background: #10a37f; color: #fff; font-size: 13px; cursor: pointer; }
    button.secondary { background: #fff; color: #10a37f; }
    button.ghost { background: #fff; color: #888; border-color: #ddd; }
    input { width: 100%; box-sizing: border-box; padding: 7px 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 12px; margin-bottom: 6px; }
    #status { font-size: 12px; color: #333; white-space: pre-wrap; min-height: 30px; }
    #lic { font-size: 12px; color: #444; background: #fafafa; border: 1px solid #eee; border-radius: 8px; padding: 8px; margin-bottom: 10px; white-space: pre-wrap; }
    .row { display: flex; gap: 6px; }
    .row button { margin-bottom: 6px; }
    a { color: #10a37f; font-size: 12px; }
  </style>
</head>
<body>
  <h1>对话记录归档助手<span id="planTag" class="tag free">免费版</span></h1>
  <div id="lic"></div>

  <button id="inject">在当前离线页注入导出脚本</button>
  <div class="row">
    <button id="help" class="secondary">使用说明</button>
    <button id="dev" class="secondary">设备码</button>
  </div>

  <div id="activateBox"></div>
  <div id="status"></div>
  <script type="module" src="popup.js"></script>
</body>
</html>
